<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="TaxKaro">
  <!--
    A torn-edged receipt in gold on bottle green, echoing the tax slip the
    calculator prints. Drawn entirely as paths: an SVG favicon renders with the
    viewer's own fonts, so any text here would become a blank box wherever the
    glyph is missing.

    Proportions are set for 16px, where a tab icon actually lives — the receipt
    fills most of the tile and carries only two heavy rules, because finer
    detail turns to mush at that size.
  -->
  <rect width="32" height="32" rx="7" fill="#072a1d"/>
  <path
    d="M7 6h18v16l-2.57 3.4L19.86 22l-2.57 3.4L14.71 22l-2.57 3.4L9.57 22 7 25.4V6z"
    fill="#c9a227"/>
  <rect x="10.5" y="10.5" width="11" height="2.6" rx="1.3" fill="#072a1d"/>
  <rect x="10.5" y="15.5" width="7" height="2.6" rx="1.3" fill="#072a1d"/>
</svg>
